<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caporalli Importados</title>
<style>
  :root{
    --bg:#0b0f14; --text:#f3f4f6; --muted:#cbd5e1;
    --card:#151b23; --line:#374151; --green:#25d366; --link:#8ab4f8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
  main{max-width:420px;margin:0 auto;padding:40px 16px 32px;text-align:center}
  .foto{width:160px;height:160px;border-radius:50%;object-fit:cover;background:var(--card);display:block;margin:0 auto}
  h1{font-size:24px;font-weight:700;margin:20px 0 12px;line-height:1.25}
  .mensagem{font-size:15px;color:var(--muted);margin:0 0 20px;line-height:1.45}
  .botao{display:block;width:100%;padding:15px 16px;border-radius:10px;border:1px solid transparent;
    font:600 17px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;text-decoration:none;cursor:pointer;margin-bottom:12px}
  .principal{background:var(--green);color:#000}
  .principal:active{filter:brightness(.92)}
  .secundario{background:var(--card);color:var(--text);border-color:var(--line)}
  .nota{font-size:13px;color:var(--muted);margin:16px 0 8px;line-height:1.5}
  .como-link{background:none;border:0;padding:0;color:var(--link);font-size:13px;text-decoration:underline;cursor:pointer}
  #qr-area{margin-top:20px}
  #qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;width:196px;height:196px}
  #qr svg{width:100%;height:100%;display:block}
  .qr-txt{font-size:12px;color:var(--muted);margin:10px auto 0;max-width:196px}
  .marca{font-size:12px;color:var(--muted);margin-top:32px}
  [hidden]{display:none!important}
</style>

  <h1 id="nome">Caporalli Importados</h1>
  <p class="mensagem">Toque em <b style="font-weight:400">Entrar no grupo</b> para abrir o WhatsApp.</p>

  <a class="botao principal" id="entrar" href="#" rel="noopener">Entrar no grupo</a>
  <button class="botao secundario" id="copiar" type="button">Copiar o link do grupo</button>

  <p class="nota">Se o WhatsApp não abrir, copie o link do grupo, cole em uma conversa do WhatsApp e toque nele.
    <br><button class="como-link" id="toggleQr" type="button">Esconder o QR Code</button></p>

  <div id="qr-area">
    <div id="qr"></div>
    <p class="qr-txt">Aponte a câmera do celular para o QR Code.</p>
  </div>

  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  // Cole o link de convite do SEU grupo:
  const LINK = "https://chat.whatsapp.com/DqmBbab1uUGEEUFiief7N0";

  document.getElementById('entrar').href = LINK;

  // Pixel: registra o toque em "Entrar no grupo" como Lead sem segurar a navegação —
  // o link precisa abrir direto do toque, senão o iPhone não abre o app do WhatsApp
  document.getElementById('entrar').addEventListener('click', function(){
    if (window.fbq) fbq('track', 'Lead', {content_name: 'Grupo WhatsApp', method: 'botao'});
  });

  const qr = qrcode(0,'M'); qr.addData(LINK); qr.make();
  document.getElementById('qr').innerHTML = qr.createSvgTag({cellSize:4,margin:0,scalable:true});

  const btn = document.getElementById('copiar');
  btn.onclick = async () => {
    if (window.fbq) fbq('trackCustom', 'CopiouLink', {content_name: 'Grupo WhatsApp'});
    try { await navigator.clipboard.writeText(LINK); }
    catch(e){ const t=document.createElement('textarea'); t.value=LINK; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    const old = btn.textContent; btn.textContent = 'Link copiado!';
    setTimeout(()=>btn.textContent = old, 1800);
  };

  const area = document.getElementById('qr-area'), tg = document.getElementById('toggleQr');
  tg.onclick = () => { area.hidden = !area.hidden; tg.textContent = area.hidden ? 'Mostrar o QR Code' : 'Esconder o QR Code'; };
</script>
